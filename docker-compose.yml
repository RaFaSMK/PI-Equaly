services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pcd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pcd_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pcd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: pcd-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pcd_database?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      NODE_ENV: development
      PORT: 3333
    volumes:
      - ./BackEnd/src:/app/src
      - ./BackEnd/prisma:/app/prisma
      - ./BackEnd/uploads:/app/uploads
      - backend_node_modules:/app/node_modules
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pcd-network

  # Frontend Next.js
  frontend:
    build:
      context: ./pcd-frontend
      dockerfile: Dockerfile
    container_name: pcd-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pcd-network

volumes:
  postgres_data:
    driver: local
  backend_node_modules:
    driver: local

networks:
  pcd-network:
    driver: bridge
