services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pcd-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pcd_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - pcd-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API (Development mode with hot reload)
  backend:
    image: node:20-alpine
    container_name: pcd-backend-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npx tsx watch src/server.ts"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pcd_database?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
      NODE_ENV: development
      PORT: 3333
    volumes:
      - ./BackEnd:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3333:3333"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pcd-network

  # Frontend Next.js (Development mode with hot reload)
  frontend:
    image: node:20-alpine
    container_name: pcd-frontend-dev
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install -g pnpm && pnpm install && pnpm dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3333/api
      NODE_ENV: development
    volumes:
      - ./pcd-frontend:/app
      - frontend_node_modules:/app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pcd-network

volumes:
  postgres_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  pcd-network:
    driver: bridge
